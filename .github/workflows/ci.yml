name: CI
run-name: Run ${{ github.run_id }} of branch ${{ github.event.pull_request.head.ref || github.ref_name }}

on:
  pull_request_review:
    types: [ submitted ]
  push:
    tags:
      - v**
    branches:
      - master


concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event.review.state == 'APPROVED' || github.event.pull_request.merged == true || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        search:
          - docker.elastic.co/elasticsearch/elasticsearch:7.10.2
          - opensearchproject/opensearch:3.7.0
    services:
      search:
        image: ${{ matrix.search }}
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
    steps:
      - name: Setting up Worker Permissions
        run: sudo chmod -R 777 ${{ github.workspace }}
      - name: Checkout with depth 0
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: uopz, amqp
          coverage: pcov
          tools: composer, phpunit:9.5
        env:
          runner: ubuntu-latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGIST_TOKEN: ${{ secrets.CELESTA_COMPOSER_TOKEN }}
      - name: Setup Composer
        uses: php-actions/composer@v6
        with:
          args: --ignore-platform-reqs
      - name: Wait for the search engine
        run: |
          until curl -s http://localhost:9200/_cluster/health; do
            echo "Waiting for the search engine..."
            sleep 2
          done
      - name: Running PHPUnit Tests
        shell: bash
        env:
          ELASTICSEARCH_HOST: localhost:9200
        run: |
          vendor/phpunit/phpunit/phpunit --coverage-clover=coverage.clover
      - name: Coverage Code Check
        uses: themichaelhall/check-code-coverage@v2
        with:
          report: coverage.clover
          required-percentage: 100
  release:
    if: contains(needs.*.result, 'success') && (github.event.pull_request.head.ref || github.ref_name) == 'master' && github.event_name == 'push'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    needs: tests
